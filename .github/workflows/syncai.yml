name: SyncAI

on:
  push:
    # Ignore pushes to main and any release/* branches
    branches-ignore:
      - main
      - 'release/*'

permissions:
  contents: write  # needed for pushing changes back

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build syncai
        run: make build

      - name: Run syncai
        run: |
          BINARY_PATH="${{ github.workspace }}/bin/syncai"
          CONFIG_PATH="${{ github.workspace }}/syncai.json"
          if [ ! -f "$CONFIG_PATH" ]; then
            echo "Error: Configuration file $CONFIG_PATH not found."
            exit 1
          fi
          "$BINARY_PATH" --no-watch --config "$CONFIG_PATH"

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add .
            git commit -m "syncai: apply updates"
            git push
          fi
